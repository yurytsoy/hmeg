[project]
name = "hmeg"
version = "0.3.1b"
requires-python = ">=3.10,<3.15"
description = "Generator of exercises for practicing speaking for language learning."
authors = [{name = "Yury Choi", email = "yurytsoy@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
urls = {repository = "https://github.com/yurytsoy/hmeg"}

dependencies = [
    "chevron>=0.14.0",
    "fire>=0.6.0",
    "inflect>=7.5.0",
    "jsonschema>=4.25.0",
    "camel-kenlm>=2026.2.7",
    "langchain>=1.2.7,<2.0.0",
    "langchain-ollama>=1.0.1,<2.0.0",
    "langgraph>=1.0.1,<2.0.0",
    "language-tool-python>=2.9.4",
    "logfire>=4.34.0",
    "nltk>=3.9.2",
    "ollama>=0.6.1",
    "openai>=2.29.0",
    "orjson>=3.11.5",
    "pandas>=2.3.0",
    "pydantic-ai>=1.104.0",
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0.3",
    "Requests>=2.32.5",
    "rich>=14.3.1,<15.0.0",
    "sentencepiece>=0.2.1",
    "spacy>=3.8.11",
    "toml>=0.10.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.10.0"
]

[project.scripts]
hmeg = "hmeg.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
