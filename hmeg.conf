topics_folder="hmeg/topics"
vocab_file="hmeg/vocabs/minilex.toml"

topic="Have, Don’t have, There is, There isn’t / 있어요, 없어요"
number_exercises=10

# Exercise generation engine settings
#
# Depending on the engine a different set of parameters is required.
# * "templates" -- uses the old exercise generation method based on templates.
#   Can do optional grammar_correction using reranker defined using
#   `grammar_correction` parameter
# * "ollama" -- uses the new exercise generation method based on LLMs.
#   Requires `model` parameter to be set to a valid ollama model.
engine="ollama"  # "ollama" | "templates"
model="gemma3:4b"  # necessary when "ollama" engine is used. Make sure you have the model downloaded for ollama
# grammar_correction="kenlm/en"  # "kenlm/en" | "distilgpt2" | "openai"
