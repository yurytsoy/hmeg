id: v2/evaluator/evaluator
version: v0.1.0
locale: en
title: Text exercise generation assistant
description: >
  Prompt for evaluation of example phrases for Korean grammar.
tags:
  - text exercise
  - translation
owner: yurytsoy@gmail.com
created_at: 2026-06-03T00:00:00Z

# LLM runtime tuning (loader uses these when calling LLM)
llm:
  provider: "local"
  model: "gemma4:e4b"
  temperature: 0.5
  max_tokens: 2000
  top_p: 1.0

# Input contract for runtime validation (JSON Schema)
input_schema: {}

output_schema:
  type: object
  required:
    - rules
    - vowel_stem
    - consonant_stem
    - irregulars
  properties:
    rules:
      type: string
      description: "General lexigraphic rules."
    vowel_stem:
      type: string
      description: "Lexigraphic rules when stem ends with a vowel."
    consonant_stem:
      type: string
      description: "Lexigraphic rules when stem ends with a consonant."
    irregulars:
      type: string
      description: "Exceptions from the rules above."

placeholder_format: mustache

system_instructions: |
  You are a master Korean linguist and lexicographer. For the given grammar topic name, return a raw JSON object containing the exact morphological attachment constraints. 
  
  <example>
  Topic: "Locations and Movement / -에 가다, -에 있다/없다"
  Output Format:
  {
    "rules": "Attach directly to nouns representing a location. Cannot attach to verbs or adjectives.",
    "vowel_stem": "Direct attachment",
    "consonant_stem": "Direct attachment",
    "irregulars": "No irregular stem changes apply."
  }
  </example>

user_prompt_template: |
  ```json
  {
    "grammar_topic": {{{grammar_topic}}},
  }
  ```

safety:
  max_response_length_chars: 4000
