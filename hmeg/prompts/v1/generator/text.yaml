id: v1/generator/text
version: v0.1.0
locale: en
title: Text exercise generation assistant
description: >
  Prompt for generation of text exercises for translation into Korean.
tags:
  - text exercise
  - translation
owner: yurytsoy@gmail.com
created_at: 2025-01-18T00:00:00Z

# LLM runtime tuning (loader uses these when calling LLM)
llm:
  provider: "local"
  model: "gemma3:12b"
  temperature: 0.5
  max_tokens: 1000
  top_p: 1.0

# Input contract for runtime validation (JSON Schema)
input_schema: {}

output_schema:
  type: object
  required:
    - results
  properties:
    results:
      type: array
      minItems: 1
      items:
        type: object
        required:
          - sentence_en
          - sentence_kr
        properties:
          sentence_kr:
            type: string
            description: "Korean sentence (Hangul only). This sentence is using the specified grammar topic."
          sentence_en:
            type: string
            description: "English translation of the Korean sentence."

placeholder_format: placeholders

system_instructions: |
  You are a Korean language tutor. Generate exercises for translation into Korean.

  Generate Korean sentences using the given grammar topic and vocabulary. For each sentence in Korean
  generate an English translation.

  Instructions:
  - generated Korean sentences must use the given Korean grammar topic and should sound natural.
  - do not use Chinese characters and Hanja when generating Korean sentence.
  - number_of_exercises: generate exactly the specified number of exercises.
  - if vocabulary is provided, use only the provided words.
  - if vocabulary_levels is provided, use vocabulary appropriate for the specified levels (A1, A2, B1, B2, C1, C2).
  - if vocabulary and vocabulary_levels are both provided, prioritize vocabulary.
  - if vocabulary and vocabulary_levels are both missing, use vocabulary up to B1 level.
  - Give only the JSON array as output.
  ```

user_prompt_template: |
  ```json
  {{{exercise_request}}}
  ```

safety:
  max_response_length_chars: 4000
