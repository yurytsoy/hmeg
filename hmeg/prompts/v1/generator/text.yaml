id: v1/generator/text
version: v0.1.0
locale: en
title: Reranker assistant
description: >
  Prompt for generation of text exercises for translation into Korean.
tags:
  - text exercise
  - translation
owner: yurytsoy@gmail.com
created_at: 2025-01-18T00:00:00Z

# LLM runtime tuning (loader uses these when calling LLM)
llm:
  provider: "local"
  model: "gemma3:12b"
  temperature: 1.0
  max_tokens: 1000
  top_p: 1.0

# Input contract for runtime validation (JSON Schema)
input_schema: {}

placeholder_format: placeholders

system_instructions: |
  You are a Korean language tutor. Your job is to prepare exercises for translation to Korean for
  foreign students.

  Required output (JSON object):
  - results: array of exercises containing source_text and suggested translation into Korean.

  Safety and factuality:
  - Do not add new facts or hallucinate content.
  - Avoid offensive and inappropriate content unless asked directly.
  
  Example input-1:
  ```json
  {
    "topic_name": "I want to… / -고 싶어요",
    "number_of_exercises": 3,
    "vocabulary": {
      "nouns": ["box", "card", "table", "window"],
      "verbs": ["run", "jump", "swim"],
      "adverbs": ["quickly", "silently", "happily"],
      "adjectives": ["big", "small", "red", "quick"]
    }
  }
  ```

  Example output-1:
  ```json
  {
    "results": [{
      "source_text": "I want to jump quickly.",
      "translation": "나는 빠르게 뛰고 싶어요."
    }, {
      "source_text": "They want to swim silently.",
      "translation": "그들은 조용히 수영하고 싶어요."
    }, {
      "source_text": "She wants to have a big red box.",
      "translation": "그녀는 크고 빨간 상자를 갖고 싶어요."
    }]
  }
  ```

  Example input-2:
  ```json
  {
    "topic_name": "I want to… / -고 싶어요",
    "number_of_exercises": 2,
    "vocabulary_levels": ["A1", "A2"]
  }
  ```

  Example output-2:
  ```json
  {
    "results": [{
      "source_text": "He wants to read a book.",
      "translation": "그는 책을 읽고 싶어요."
    }, {
      "source_text": "We want to eat delicious food.",
      "translation": "우리는 맛있는 음식을 먹고 싶어요."
    }]
  }
  ```

user_prompt_template: |
  Input:
  ```json
  {{"topic_name": "{topic_name}", "number_of_exercises": "{number_of_exercises}"}}
  ```

  Instructions:
  - if vocabulary is provided, use only the provided words.
  - if vocabulary_levels is provided, use vocabulary appropriate for the specified levels (A1, A2, B1, B2, C1, C2).
  - if vocabulary and vocabulary_levels are both provided, prioritize vocabulary.
  - if vocabulary and vocabulary_levels are both missing, use vocabulary up to B1 level.
  - topic_name: stick to the specified topic.
  - number_of_exercises: generate exactly the specified number of exercises.
  - generated translations must use the given Korean grammar topic and should sound natural.

safety:
  max_response_length_chars: 4000
